[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Ottimo is a client-side React Router application. Serve index.html
# for application routes so direct navigation and refreshes work in production.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["playwright", "@sparticuz/chromium"]

[functions."audit-site"]
  timeout = 55
  memory = 2048

 
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
